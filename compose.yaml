services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: flask-dragoesc

    ports:
      - "5000:5000"

    depends_on:
      mysql:
        condition: service_started

    env_file:
      - .env

  mysql:
    image: mysql:8.4

    container_name: mysql-dragoes

    restart: unless-stopped

    ports:
      - "3307:3306"

    environment:
      MYSQL_DATABASE: dragoes
      MYSQL_ROOT_PASSWORD: "1234"

    volumes:
      - mysql_data:/var/lib/mysql


volumes:
  mysql_data:   
